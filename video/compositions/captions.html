    <div data-hf-id="hf-8hbt" id="cap0" class="clip cap" data-start="0.29" data-duration="2.80"><span data-hf-id="hf-2n53">Most of the world's rivers have no gauge.</span></div>
    <div data-hf-id="hf-z90e" id="cap1" class="clip cap" data-start="3.09" data-duration="3.64"><span data-hf-id="hf-548a">A gauging station costs tens of thousands of dollars,</span></div>

    <div data-hf-id="hf-z0vs" id="cap4" class="clip cap" data-start="12.23" data-duration="2.13"><span data-hf-id="hf-g2hg">A camera can measure a river,</span></div>
    <div data-hf-id="hf-2b3n" id="cap5" class="clip cap" data-start="14.36" data-duration="3.67"><span data-hf-id="hf-rd0c">track the surface and pixels become metres per second.</span></div>
    <div data-hf-id="hf-xrmb" id="cap6" class="clip cap" data-start="18.03" data-duration="0.81"><span data-hf-id="hf-ggkt">But on shaky,</span></div>

    <div data-hf-id="hf-uwkm" id="cap8" class="clip cap" data-start="21.19" data-duration="2.63"><span data-hf-id="hf-uyox">the same code returns a confident,</span></div>

    <div data-hf-id="hf-ytrs" id="cap10" class="clip cap" data-start="27.43" data-duration="3.51"><span data-hf-id="hf-eeq6">Gaugeless is an OpenCV 5 agent that</span></div>
    <div data-hf-id="hf-9b7q" id="cap11" class="clip cap" data-start="30.94" data-duration="3.16"><span data-hf-id="hf-eltq">judges the footage before it trusts the number.</span></div>
    <div data-hf-id="hf-kvir" id="cap12" class="clip cap" data-start="34.60" data-duration="2.10"><span data-hf-id="hf-71zc">This is a real river in France,</span></div>

    <div data-hf-id="hf-5zpn" id="cap14" class="clip cap" data-start="38.12" data-duration="1.92"><span data-hf-id="hf-ysy0">We add heavy camera shake.</span></div>

    <div data-hf-id="hf-ba5e" id="cap32" class="clip cap" data-start="86.65" data-duration="3.10"><span data-hf-id="hf-e13f">but the agent cannot send the alert itself.</span></div>

    <div data-hf-id="hf-8r3c" id="cap41" class="clip cap" data-start="108.73" data-duration="2.17"><span data-hf-id="hf-qypb">Thirteen tools carry the guard rails,</span></div>
    <div data-hf-id="hf-pu4y" id="cap42" class="clip cap" data-start="110.90" data-duration="1.99"><span data-hf-id="hf-g9sf">so no planner can skip them.</span></div>
