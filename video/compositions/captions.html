<template>
  <style>
    @font-face { font-family: "Excalifont"; src: url("assets/fonts/excalifont.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; pointer-events: none; }
    .cap { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; }
    .cap span { display: inline-block; max-width: 1500px; padding: 10px 26px 12px; border-radius: 14px; background: rgba(255,255,255,0.94);
                border: 2px solid #1e1e1e; color: #1e1e1e; font-family: "Excalifont", sans-serif; font-size: 40px; line-height: 1.2; }
  </style>
  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="163">
    <div id="cap0" class="clip cap" data-start="0.29" data-duration="2.80"><span>Most of the world's rivers have no gauge.</span></div>
    <div id="cap1" class="clip cap" data-start="3.09" data-duration="3.64"><span>A gauging station costs tens of thousands of dollars,</span></div>
    <div id="cap2" class="clip cap" data-start="6.73" data-duration="0.97"><span>so the small,</span></div>
    <div id="cap3" class="clip cap" data-start="7.70" data-duration="4.30"><span>fast rivers that cause flash floods go unmeasured.</span></div>
    <div id="cap4" class="clip cap" data-start="12.23" data-duration="2.13"><span>A camera can measure a river,</span></div>
    <div id="cap5" class="clip cap" data-start="14.36" data-duration="3.67"><span>track the surface and pixels become metres per second.</span></div>
    <div id="cap6" class="clip cap" data-start="18.03" data-duration="0.81"><span>But on shaky,</span></div>
    <div id="cap7" class="clip cap" data-start="18.84" data-duration="2.35"><span>flickering or featureless footage,</span></div>
    <div id="cap8" class="clip cap" data-start="21.19" data-duration="2.63"><span>the same code returns a confident,</span></div>
    <div id="cap9" class="clip cap" data-start="23.82" data-duration="3.26"><span>wrong number and nobody is warned.</span></div>
    <div id="cap10" class="clip cap" data-start="27.43" data-duration="3.51"><span>Gaugeless is an OpenCV 5 agent that</span></div>
    <div id="cap11" class="clip cap" data-start="30.94" data-duration="3.16"><span>judges the footage before it trusts the number.</span></div>
    <div id="cap12" class="clip cap" data-start="34.30" data-duration="5.00"><span>Built by Favour Olaboye and Opeyemi Mobolaji.</span></div>
    <div id="cap13" class="clip cap" data-start="39.60" data-duration="2.10"><span>This is a real river in France,</span></div>
    <div id="cap14" class="clip cap" data-start="41.70" data-duration="1.42"><span>filmed from a pole.</span></div>
    <div id="cap15" class="clip cap" data-start="43.12" data-duration="1.92"><span>We add heavy camera shake.</span></div>
    <div id="cap16" class="clip cap" data-start="45.04" data-duration="2.32"><span>The agent measures the motion on the banks,</span></div>
    <div id="cap17" class="clip cap" data-start="47.36" data-duration="1.52"><span>stabilises the clip,</span></div>
    <div id="cap18" class="clip cap" data-start="48.88" data-duration="2.80"><span>and checks that the repair actually worked.</span></div>
    <div id="cap19" class="clip cap" data-start="51.68" data-duration="3.36"><span>Then it measures the flow at two surveyed cross-sections,</span></div>
    <div id="cap20" class="clip cap" data-start="55.04" data-duration="1.40"><span>checks that they agree,</span></div>
    <div id="cap21" class="clip cap" data-start="56.44" data-duration="1.20"><span>and publishes.</span></div>
    <div id="cap22" class="clip cap" data-start="57.64" data-duration="3.74"><span>1.316 cubic metres per second.</span></div>
    <div id="cap23" class="clip cap" data-start="61.38" data-duration="4.24"><span>The current meter gauging says 1.321.</span></div>
    <div id="cap24" class="clip cap" data-start="65.62" data-duration="2.87"><span>This clip has nothing on the water to track.</span></div>
    <div id="cap25" class="clip cap" data-start="68.49" data-duration="2.86"><span>Standard methods would report almost zero</span></div>
    <div id="cap26" class="clip cap" data-start="71.35" data-duration="2.52"><span>flow with full confidence.</span></div>
    <div id="cap27" class="clip cap" data-start="73.87" data-duration="2.93"><span>Gaugeless measures tracer density first and</span></div>
    <div id="cap28" class="clip cap" data-start="76.80" data-duration="3.72"><span>refuses with advice to seed the surface.</span></div>
    <div id="cap29" class="clip cap" data-start="81.59" data-duration="2.26"><span>Now Claude on Amazon Bedrock is</span></div>
    <div id="cap30" class="clip cap" data-start="83.85" data-duration="3.18"><span>planning and we set a flood threshold.</span></div>
    <div id="cap31" class="clip cap" data-start="87.03" data-duration="2.72"><span>Claude works through the same guarded tools.</span></div>
    <div id="cap32" class="clip cap" data-start="89.75" data-duration="1.90"><span>The flow is over the threshold</span></div>
    <div id="cap33" class="clip cap" data-start="91.65" data-duration="3.10"><span>but the agent cannot send the alert itself.</span></div>
    <div id="cap34" class="clip cap" data-start="94.75" data-duration="2.90"><span>It stops and waits for a human.</span></div>
    <div id="cap35" class="clip cap" data-start="97.65" data-duration="3.01"><span>Only after approval does the alert go out.</span></div>
    <div id="cap36" class="clip cap" data-start="102.16" data-duration="0.98"><span>Under the hood,</span></div>
    <div id="cap37" class="clip cap" data-start="103.14" data-duration="3.00"><span>OpenCV 5 does all the vision,</span></div>
    <div id="cap38" class="clip cap" data-start="106.14" data-duration="1.16"><span>optical flow,</span></div>
    <div id="cap39" class="clip cap" data-start="107.30" data-duration="1.26"><span>template matching,</span></div>
    <div id="cap40" class="clip cap" data-start="108.56" data-duration="1.19"><span>space-time images,</span></div>
    <div id="cap41" class="clip cap" data-start="109.75" data-duration="3.92"><span>and a camera solve that straightens raw oblique video.</span></div>
    <div id="cap42" class="clip cap" data-start="113.73" data-duration="2.17"><span>Thirteen tools carry the guard rails,</span></div>
    <div id="cap43" class="clip cap" data-start="115.90" data-duration="1.99"><span>so no planner can skip them.</span></div>
    <div id="cap44" class="clip cap" data-start="117.89" data-duration="1.19"><span>On AWS,</span></div>
    <div id="cap45" class="clip cap" data-start="119.08" data-duration="3.47"><span>clips land in S3,</span></div>
    <div id="cap46" class="clip cap" data-start="122.55" data-duration="1.50"><span>queue through SQS,</span></div>
    <div id="cap47" class="clip cap" data-start="124.05" data-duration="2.19"><span>and run on a Graviton worker,</span></div>
    <div id="cap48" class="clip cap" data-start="126.24" data-duration="3.44"><span>while Step Functions holds every alert for a person.</span></div>
    <div id="cap49" class="clip cap" data-start="129.68" data-duration="0.98"><span>And on COOL,</span></div>
    <div id="cap50" class="clip cap" data-start="130.66" data-duration="3.22"><span>the optimised OpenCV build for Graviton,</span></div>
    <div id="cap51" class="clip cap" data-start="133.88" data-duration="4.20"><span>the agent ran 1.16 times faster.</span></div>
    <div id="cap52" class="clip cap" data-start="139.06" data-duration="1.83"><span>On five real rivers,</span></div>
    <div id="cap53" class="clip cap" data-start="140.89" data-duration="3.23"><span>discharge came within 0.4 to 14</span></div>
    <div id="cap54" class="clip cap" data-start="144.12" data-duration="2.38"><span>percent of in-river measurements.</span></div>
    <div id="cap55" class="clip cap" data-start="146.50" data-duration="2.50"><span>On 105 damaged clips,</span></div>
    <div id="cap56" class="clip cap" data-start="149.00" data-duration="4.54"><span>a fixed pipeline published 24 silently wrong numbers.</span></div>
    <div id="cap57" class="clip cap" data-start="153.54" data-duration="2.48"><span>Gaugeless published zero.</span></div>
    <div id="cap58" class="clip cap" data-start="157.25" data-duration="2.21"><span>Gaugeless, measure what you can,</span></div>
    <div id="cap59" class="clip cap" data-start="159.46" data-duration="1.72"><span>refuse what you can't.</span></div>
  </div>
